[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeloop"
version = "0.1.0"
description = "A small, provider-neutral CLI coding agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "keyring>=25,<26",
  "httpx>=0.27,<1",
  "litellm>=1.75,<2",
  "openai>=2,<3",
  "rich>=13,<15",
  "textual>=6,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
deepswe = [
  "datacurve-pier @ git+https://github.com/datacurve-ai/pier.git@34c18f0e4eed88877c28721f5c5871a950bec637 ; python_version >= '3.12'",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
forgeloop = "forgeloop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeloop"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "docker: requires a running local Docker Engine",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
